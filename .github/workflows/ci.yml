name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # shellcheck is preinstalled on ubuntu runners only.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x -s bash bin/archlint tests/run.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install ast-grep
        run: npm install -g @ast-grep/cli@0.45.3
      - name: tests
        run: tests/run.sh
